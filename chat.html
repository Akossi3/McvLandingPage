<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat avec MCV - Ma Conseillère Voyage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>Ma Conseillère Voyage</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="about.html">À Propos</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="chat.html" class="active">Chat</a></li>
                <li id="user-info"></li>
            </ul>
        </div>
    </nav>

    <section class="chat-container">
        <div class="chat-wrapper">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-avatar">🌍</div>
                    <div>
                        <h2>Assistant MCV</h2>
                        <p class="chat-status">En ligne</p>
                    </div>
                </div>
                <button onclick="window.location.href='index.html'" class="btn-back">← Retour</button>
            </div>

            <div id="chat-messages" class="chat-messages">
                <!-- Messages will be loaded here -->
            </div>

            <form id="chat-form" class="chat-input-container">
                <textarea
                    id="message-input"
                    placeholder="Posez votre question sur les voyages..."
                    rows="1"
                    required
                ></textarea>
                <button type="submit" id="send-button" class="send-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </form>
        </div>
    </section>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/chat.js"></script>
    <script type="module">
        import { initAuth } from './js/auth.js';
        import { initChat } from './js/chat.js';

        // Initialize authentication
        initAuth();

        // Initialize chat
        initChat();

        // Auto-resize textarea
        const textarea = document.getElementById('message-input');
        if (textarea) {
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }
    </script>
</body>
</html>
